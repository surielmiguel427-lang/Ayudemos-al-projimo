<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Donar - Ayudemos al Prójimo</title>
    <style>
        /* --- ANIMACIONES --- */
        .form-reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1.2s cubic-bezier(0.21, 1.02, 0.73, 1);
        }

        .form-reveal.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-donar:hover {
            background-color: #1A3922 !important;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-donar:active {
            transform: translateY(0);
        }

        nav a { text-decoration: none; transition: 0.3s; }
        nav a:hover { color: #f0c040 !important; }

        /* Estilo para el mensaje de éxito */
        #mensaje-agradecimiento {
            display: none; /* Oculto por defecto */
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body style="background-color: #FFFFFF; color: #1A3922; font-family: sans-serif; margin: 0; overflow-x: hidden;">
    
    <header style="background-color: #1A3922; color: white; padding: 20px; text-align: center;">
        <h1>AYUDEMOS AL PRÓJIMO</h1>
        <nav>
            <a href="index.html" style="color: white;">Inicio</a> | 
            <a href="proyecto.html" style="color: white;">Proyecto</a> | 
            <a href="estadisticas.html" style="color: white;">Estadísticas</a> | 
            <a href="ayudar.html" style="color: white;">Cómo Ayudar</a> |
            <a href="forms.html" style="color: white;">Formulario para donar</a>
        </nav>
    </header>

    <main style="padding: 40px 20px;">
        <section id="contenedor-formulario" class="form-reveal" style="max-width: 600px; margin: 0 auto; border: 2px solid #1A3922; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: white;">
            
            <div id="form-header" style="background-color: #1A3922; color: white; padding: 15px; text-align: center;">
                <h2 style="margin: 0;">Formulario de Donación</h2>
                <p style="margin: 5px 0 0; font-size: 0.9em;">Tu ayuda transforma La Tinajita</p>
            </div>

            <form id="donacionForm" style="padding: 30px; display: flex; flex-direction: column; gap: 20px;">
                
                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px;">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>

                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px;">¿Qué deseas donar?</label>
                    <select name="tipo_donacion" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; background: white;">
                        <option value="alimentos">Alimentos no perecederos</option>
                        <option value="árboles">Árboles de cacao / Limón, etc.</option>
                        <option value="materiales">Materiales de construcción</option>
                        <option value="económico">Aporte Económico</option>
                        <option value="otro">Otros</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px;">Cantidad / Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="3" required placeholder="Detalla brevemente lo que vas a donar..." style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; resize: none; box-sizing: border-box;"></textarea>
                </div>

                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px;">Teléfono de Contacto:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="809-000-0000" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>

                <button type="submit" class="btn-donar" style="background-color: #78350F; color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: 0.3s; outline: none;">
                    Registrar Donación
                </button>
            </form>

            <div id="mensaje-agradecimiento">
                <div style="font-size: 50px;">❤️</div>
                <h2 style="color: #1A3922;">¡Muchas gracias, <span id="usuario-nombre"></span>!</h2>
                <p>Tu generosidad marcará la diferencia en nuestra comunidad.</p>
                <button onclick="location.reload()" style="background-color: #1A3922; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;">Enviar otra donación</button>
            </div>
        </section>
    </main>

    <footer style="text-align: center; padding: 20px; color: #555;">
        <p>© Misión ILAC & Colegio Intelecto - 2026</p>
    </footer>

    <script>
        // --- ANIMACIÓN DE REVELADO ---
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.form-reveal').forEach(el => {
            observer.observe(el);
        });

        // --- LÓGICA DE VALIDACIÓN Y ENVÍO ---
        const formulario = document.getElementById('donacionForm');
        const mensajeExito = document.getElementById('mensaje-agradecimiento');
        const formHeader = document.getElementById('form-header');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se recargue

            // Obtener valores
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();

            // Validación simple
            if (nombre.length < 3) {
                alert("Por favor, introduce un nombre válido.");
                return;
            }

            if (telefono.length < 7) {
                alert("Por favor, introduce un número de teléfono válido.");
                return;
            }

            // Si todo está bien:
            // 1. Ocultar el formulario y el encabezado
            formulario.style.display = 'none';
            formHeader.style.display = 'none';

            // 2. Personalizar y mostrar mensaje de agradecimiento
            document.getElementById('usuario-nombre').innerText = nombre;
            mensajeExito.style.display = 'block';
        });
    </script>
</body>
</html>
